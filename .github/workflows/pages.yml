# Construit le site avec tools/build.py et le publie sur GitHub Pages à chaque push sur main et chaque matin.
name: Publier le site
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Chaque jour à 04:17 (heure de Bobo-Dioulasso) : les dates passées sortent de l'agenda.
    - cron: "17 4 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
